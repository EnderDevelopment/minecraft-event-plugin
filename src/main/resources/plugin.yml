name: EventoPlugin
version: 1.21.11-26
main: com.enderdevelopment.plugin.Main
author: EnderDevelopment
api-version: "1.21"
commands:
  evento:
    description: Gerencia eventos no servidor.
    usage: /evento <criar|iniciar|finalizar|listar|participar>
    permission: evento.admin
    permission-message: Você não tem permissão para usar este comando.
permissions:
  evento.admin:
    description: Permite gerenciar eventos.
    default: op
  evento.participar:
    description: Permite participar de eventos.
    default: true